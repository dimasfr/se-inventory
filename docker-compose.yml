services:
  db:
    image: postgres:17
    container_name: se-inventory
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: se_inventory
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d se_inventory"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
